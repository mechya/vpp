# The checks every pull request must pass (CONTRIBUTING.md, "Pull request checklist").
# The Rust version comes from rust-toolchain.toml; rustup installs it on each runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  hidden-characters:
    name: Hidden characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Zero-width and text-direction characters can make code read differently
      # from how it runs ("Trojan Source"). In source code they are written as
      # escapes. Data files that must contain them are listed, one exact path
      # each, in .github/hidden-characters-allowlist (lead maintainer only).
      - name: Refuse zero-width and direction-changing characters
        env:
          LC_ALL: C.UTF-8
        run: |
          found=$(git ls-files -z | xargs -0 grep -lIP '[\x{200B}-\x{200D}\x{2060}\x{FEFF}\x{202A}-\x{202E}\x{2066}-\x{2069}]' || true)
          allowlist=.github/hidden-characters-allowlist
          allowed=$(tr -d '\r' < "$allowlist" | grep -v '^[[:space:]]*#' | sed 's/[[:space:]]*#.*$//; /^[[:space:]]*$/d' || true)
          if [ -n "$found" ] && [ -n "$allowed" ]; then
            echo "Allowed by $allowlist:"
            printf '%s\n' "$found" | grep -xF -f <(printf '%s\n' "$allowed") || true
            found=$(printf '%s\n' "$found" | grep -vxF -f <(printf '%s\n' "$allowed") || true)
          fi
          if [ -n "$found" ]; then
            echo "::error::Hidden or direction-changing Unicode characters in:"
            echo "$found"
            echo "Write them as escapes (for example \u{2067}), or ask the lead maintainer to add a data file to $allowlist."
            exit 1
          fi
          echo "No hidden characters outside the allowlist."

  test:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the current focus. Add macos-latest and ubuntu-latest when
        # those platforms start (docs/rust-port.md §8).
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Minimum Rust version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Keep in step with rust-version in Cargo.toml.
      - run: rustup toolchain install 1.87 --profile minimal
      - run: cargo +1.87 check --workspace --all-targets

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
