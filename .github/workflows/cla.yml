# Contributor License Agreement check (CLA.md, docs/rust-port.md §7.1).
# On a contributor's first pull request, CLA Assistant Lite comments with a link
# to CLA.md. They sign by replying with the sentence it gives. Signatures are
# stored on the `cla-signatures` branch, so the protected `main` never changes.
#
# pull_request_target is safe here: this workflow never checks out or runs the
# pull request's code, it only reads comments and writes the signature file.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    steps:
      - if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/mechya/vpp/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The licensor does not need to sign; bots cannot.
          allowlist: mechya,dependabot[bot]
